<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — SecureChat</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a; --surface: #111827; --border: #1e2d45;
      --accent: #00d4ff; --accent2: #7c3aed;
      --text: #e2e8f0; --muted: #64748b;
      --error: #f87171; --success: #34d399;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .container {
      width: 100%; max-width: 420px; padding: 2rem;
      position: relative; z-index: 1;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; margin-bottom: 2.5rem; }
    .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 14px; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 1.5rem; margin-bottom: 1rem;
    }
    .logo h1 {
      font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 600;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo p { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; font-family: 'JetBrains Mono', monospace; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem; box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }
    .card-title {
      font-size: 1rem; font-weight: 500; margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .card-title::before {
      content: ''; display: block; width: 3px; height: 1rem;
      background: linear-gradient(to bottom, var(--accent), var(--accent2)); border-radius: 2px;
    }
    .field { margin-bottom: 1.2rem; }
    label {
      display: block; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); margin-bottom: 0.4rem;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1rem; color: var(--text);
      font-size: 0.9rem; font-family: 'JetBrains Mono', monospace;
      transition: border-color 0.2s; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
    .btn {
      width: 100%; padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none; border-radius: 8px; color: #fff;
      font-size: 0.9rem; cursor: pointer; margin-top: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 1rem; padding: 0.7rem 1rem; border-radius: 8px;
      font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; display: none;
    }
    .msg.error   { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); display: block; }
    .msg.success { background: rgba(52,211,153,0.1);  border: 1px solid rgba(52,211,153,0.3);  color: var(--success); display: block; }
    .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--muted); }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .warn {
      margin-top: 1rem; padding: 0.7rem 1rem; border-radius: 8px;
      font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      background: rgba(248,113,113,0.05); border: 1px solid rgba(248,113,113,0.1);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <h1>SecureChat</h1>
      <p>End-to-End Encrypted Chat</p>
    </div>
    <div class="card">
      <div class="card-title">ログイン</div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="ユーザー名を入力" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password">
      </div>
      <button class="btn" id="btn" onclick="login()">ログイン</button>
      <div id="msg" class="msg"></div>
      <!-- v2: localStorageに秘密鍵がなくてもバックアップから復元できるため警告は不要になった -->
    </div>
    <div class="footer-link">
      アカウントをお持ちでない方は <a href="/register">新規登録</a>
    </div>
  </div>

  <!-- v2追加: PBKDF2による秘密鍵復元のためcrypto.jsを読み込む -->
  <script src="/static/crypto.js"></script>
  <script>
    // e.isComposing で日本語変換中のEnterを無視する
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) login(); });

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn      = document.getElementById('btn');
      const msg      = document.getElementById('msg');

      msg.className = 'msg';
      if (!username || !password) {
        msg.className = 'msg error';
        msg.textContent = 'ユーザー名とパスワードを入力してください';
        return;
      }

      btn.disabled = true;
      btn.textContent = '認証中...';

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = 'ログイン成功！';

          // ---- v2追加: localStorageに秘密鍵がない場合はサーバーから復元する ----
          // !localStorage.getItem(...) → 秘密鍵が存在しない場合はtrue
          // 機種変更・キャッシュ削除後のログインで自動的に復元される
          if (!localStorage.getItem('privateKey')) {
            try {
              msg.textContent = 'ログイン成功！秘密鍵を復元中...';

              // サーバーから暗号化済み秘密鍵を取得
              const keyRes  = await fetch('/api/account/encrypted-key');
              const keyData = await keyRes.json();

              // encrypted_keyが存在する場合のみ復元する
              // （旧バージョンのアカウントはnullが返る）
              if (keyData.encrypted_key) {
                // パスワードからPBKDF2でAES鍵を再現してRSA秘密鍵を復号する
                // 同じパスワード + 暗号文内のSalt → 必ず同じAES鍵が再現される
                const privateKeyJwk = await decryptPrivateKeyWithPassword(
                  keyData.encrypted_key,
                  password  // ユーザーが入力したパスワード（平文）
                );

                // 復元したRSA秘密鍵をlocalStorageに保存
                localStorage.setItem('privateKey', JSON.stringify(privateKeyJwk));
                msg.textContent = 'ログイン成功！秘密鍵を復元しました';
              }
            } catch (e) {
              // 復元に失敗してもログイン自体は成功しているため続行する
              // パスワードが違う場合やバックアップがない場合にここに来る
              console.warn('秘密鍵の復元に失敗しました:', e);
            }
          }
          // ---- v2追加ここまで ----

          setTimeout(() => window.location.href = '/', 600);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || 'ログインに失敗しました';
          btn.disabled = false;
          btn.textContent = 'ログイン';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'サーバーに接続できませんでした';
        btn.disabled = false;
        btn.textContent = 'ログイン';
      }
    }
  </script>
</body>
</html>
