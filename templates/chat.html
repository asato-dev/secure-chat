<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureChat</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a; --surface: #111827; --surface2: #162032;
      --border: #1e2d45; --accent: #00d4ff; --accent2: #7c3aed;
      --text: #e2e8f0; --muted: #64748b;
      --error: #f87171; --success: #34d399;
      --bubble-me: #1a2744; --bubble-other: #162032;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ヘッダー */
    header {
      background: rgba(10,14,26,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.2rem; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .logo {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 600;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; font-size: 0.8rem;
    }
    .header-right { display: flex; align-items: center; gap: 0.8rem; }
    .user-badge {
      font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 0.25rem 0.7rem;
    }
    .btn-logout {
      font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-logout:hover { color: var(--error); border-color: var(--error); }
    .btn-settings {
      font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-settings:hover { color: var(--accent); border-color: var(--accent); }

    /* モーダル */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem; width: 320px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      animation: fadeUp 0.2s ease both;
    }
    .modal h2 {
      font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .modal p { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .modal-btns { display: flex; gap: 0.6rem; flex-direction: column; }
    .input-field {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.6rem 0.8rem; color: var(--text);
      font-size: 0.82rem; font-family: 'JetBrains Mono', monospace;
      outline: none; margin-bottom: 0.5rem; box-sizing: border-box;
    }
    .input-field:focus { border-color: var(--accent); }
    .section-title {
      font-size: 0.78rem; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); margin: 1rem 0 0.5rem;
      padding-bottom: 0.4rem; border-bottom: 1px solid var(--border);
    }
    .btn-primary {
      width: 100%; padding: 0.7rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none; border-radius: 8px; color: #fff;
      font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s;
      margin-bottom: 0.4rem;
    }
    .btn-primary:hover { opacity: 0.9; }
    .modal-msg {
      font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      padding: 0.4rem 0.6rem; border-radius: 6px; display: none; margin-bottom: 0.4rem;
    }
    .modal-msg.error   { background: rgba(248,113,113,0.1); color: var(--error); display: block; }
    .modal-msg.success { background: rgba(52,211,153,0.1);  color: var(--success); display: block; }
    .btn-danger {
      width: 100%; padding: 0.7rem;
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px; color: var(--error);
      font-size: 0.85rem; cursor: pointer; transition: background 0.2s;
    }
    .btn-danger:hover { background: rgba(248,113,113,0.2); }
    .btn-cancel {
      width: 100%; padding: 0.7rem;
      background: none; border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted);
      font-size: 0.85rem; cursor: pointer; transition: background 0.2s;
    }
    .btn-cancel:hover { background: var(--surface2); }

    /* メインレイアウト */
    .main {
      display: flex; flex: 1; overflow: hidden;
    }

    /* サイドバー（ユーザーリスト） */
    .sidebar {
      width: 240px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item {
      padding: 0.8rem 1rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.6rem;
      transition: background 0.15s; border-bottom: 1px solid rgba(30,45,69,0.5);
    }
    .user-item:hover { background: var(--surface2); }
    .user-item.active { background: rgba(0,212,255,0.06); border-left: 2px solid var(--accent); }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 600; flex-shrink: 0;
    }
    .user-name { font-size: 0.85rem; font-weight: 500; }

    /* チャットエリア */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header {
      padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border);
      background: var(--surface); display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .chat-partner {
      display: flex; align-items: center; gap: 0.6rem;
      font-size: 0.9rem; font-weight: 500;
    }
    .e2e-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.65rem; font-family: 'JetBrains Mono', monospace;
      color: var(--accent); background: rgba(0,212,255,0.06);
      border: 1px solid rgba(0,212,255,0.15); border-radius: 20px;
      padding: 0.2rem 0.6rem;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 1rem 1.2rem;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .message {
      display: flex; flex-direction: column; max-width: 72%;
      animation: fadeUp 0.3s ease both;
    }
    .message.mine { align-self: flex-end; align-items: flex-end; }
    .message.other { align-self: flex-start; align-items: flex-start; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .bubble {
      padding: 0.65rem 0.9rem; border-radius: 12px;
      font-size: 0.88rem; line-height: 1.5; word-break: break-word;
    }
    .message.mine  .bubble { background: var(--bubble-me);    border: 1px solid rgba(0,212,255,0.15); border-bottom-right-radius: 4px; }
    .message.other .bubble { background: var(--bubble-other); border: 1px solid var(--border);         border-bottom-left-radius: 4px; }
    .bubble.decrypting { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
    .meta {
      font-size: 0.65rem; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); margin-top: 0.2rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .lock-icon { color: rgba(0,212,255,0.5); }

    /* 入力エリア */
    .input-area {
      padding: 0.8rem 1.2rem; border-top: 1px solid var(--border);
      background: var(--surface); display: flex; gap: 0.6rem; align-items: flex-end;
      flex-shrink: 0;
    }
    textarea {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.6rem 0.9rem; color: var(--text);
      font-size: 0.88rem; font-family: 'Noto Sans JP', sans-serif;
      resize: none; outline: none; max-height: 120px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }
    .send-btn {
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none; border-radius: 8px; color: #fff;
      font-size: 0.85rem; cursor: pointer; flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.9; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 空状態・プレースホルダー */
    .empty-chat {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; color: var(--muted);
    }
    .empty-chat .icon { font-size: 2.5rem; opacity: 0.3; }
    .empty-chat p { font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; }

    /* スクロールバー */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 600px) {
      .sidebar { width: 60px; }
      .sidebar-header { display: none; }
      .user-name { display: none; }
      .user-item { justify-content: center; padding: 0.8rem 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🔐</div>
      SecureChat
    </div>
    <div class="header-right">
      <span class="user-badge" id="myName">...</span>
      <button class="btn-settings" onclick="openSettings()">設定</button>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </header>
<!-- 設定モーダル -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal" style="width:360px">
    <h2>⚙️ アカウント設定</h2>

    <!-- ユーザー名変更 -->
    <div class="section-title">ユーザー名を変更</div>
    <input class="input-field" type="text" id="newUsername" placeholder="新しいユーザー名">
    <div style="font-size:0.7rem;color:var(--muted);margin-bottom:0.4rem;font-family:'JetBrains Mono',monospace;">
      英数字とアンダースコア（_）のみ使用できます
    </div>
    <div class="modal-msg" id="usernameMsg"></div>
    <button class="btn-primary" onclick="changeUsername()">ユーザー名を変更する</button>

    <!-- パスワード変更 -->
    <div class="section-title">パスワードを変更</div>
    <input class="input-field" type="password" id="oldPassword" placeholder="現在のパスワード">
    <input class="input-field" type="password" id="newPassword" placeholder="新しいパスワード（8文字以上）">
    <div style="font-size:0.7rem;color:var(--muted);margin-bottom:0.4rem;font-family:'JetBrains Mono',monospace;">
      8文字以上で入力してください
    </div>
    <div class="modal-msg" id="passwordMsg"></div>
    <button class="btn-primary" onclick="changePassword()">パスワードを変更する</button>

    <!-- アカウント削除 -->
    <div class="section-title">危険な操作</div>
    <p>アカウントを削除すると、全てのメッセージも削除されます。この操作は取り消せません。</p>
    <div class="modal-btns">
      <button class="btn-danger" onclick="deleteAccount()">🗑 アカウントを削除する</button>
      <button class="btn-cancel" onclick="closeSettings()">閉じる</button>
    </div>
  </div>
</div>


  <div class="main">

    <!-- サイドバー -->
    <div class="sidebar">
      <div class="sidebar-header">// users</div>
      <div class="user-list" id="userList">
        <div style="padding:1rem;font-size:0.75rem;color:var(--muted);font-family:monospace;">読み込み中...</div>
      </div>
    </div>

    <!-- チャットエリア -->
    <div class="chat-area" id="chatArea">
      <div class="empty-chat" id="emptyState">
        <div class="icon">💬</div>
        <p>左のリストからチャット相手を選んでください</p>
        <p style="font-size:0.7rem;margin-top:0.3rem;">🔒 全メッセージはE2E暗号化されます</p>
      </div>
    </div>

  </div>

  <script src="/static/crypto.js"></script>
  <script>
    let myId         = null;
    let partnerId    = null;
    let partnerName  = null;
    let pollInterval = null;

    // ================================================================
    // 初期化
    // ================================================================
    async function init() {
      const res  = await fetch('/api/me');
      const me   = await res.json();
      myId       = me.id;
      document.getElementById('myName').textContent = me.username;
      loadUsers();
    }

      // エスケープ関数
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }
    // ================================================================
    // ユーザーリストの読み込み
    // ================================================================
    async function loadUsers() {
      const res   = await fetch('/api/users');
      const users = await res.json();
      const list  = document.getElementById('userList');

      if (users.length === 0) {
        list.innerHTML = '<div style="padding:1rem;font-size:0.75rem;color:var(--muted);font-family:monospace;">他のユーザーがいません</div>';
        return;
      }
      list.innerHTML = users.map(u => `
        <div class="user-item" id="user-${u.id}" onclick="selectPartner(${u.id}, '${escapeHtml(u.username)}')">
          <div class="avatar">${escapeHtml(u.username)[0].toUpperCase()}</div>
          <div class="user-name">${escapeHtml(u.username)}</div>
        </div>
      `).join('');

      // クリックイベントはJSで設定する（onclickにユーザー名を埋め込まない）
      users.forEach(u => {
        const el = document.getElementById(`user-${u.id}`);
        el.dataset.name = u.username; // data属性への代入は自動的に安全
        el.addEventListener('click', () => selectPartner(u.id, el.dataset.name));
      });
    }

    // 問題4修正: 特殊文字をHTMLとして解釈されないよう無害化する関数
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ================================================================
    // チャット相手を選択
    // ================================================================
    function selectPartner(id, name) {
      partnerId   = id;
      partnerName = name;

      // 相手を切り替えたら描画済みIDをリセット
      renderedIds.clear();

      // アクティブ状態を更新
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`user-${id}`).classList.add('active');

      // チャットUIを構築
      document.getElementById('chatArea').innerHTML = `
        <div class="chat-header">
          <div class="chat-partner">
            <div class="avatar">${name[0].toUpperCase()}</div>
            ${name}
          </div>
          <span class="e2e-badge">🔒 E2E暗号化</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
          <textarea id="msgInput" placeholder="メッセージを入力（Enterで送信）" rows="1"
            oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">送信</button>
        </div>
      `;

      document.getElementById('msgInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });

      // 既存メッセージを読み込み
      loadMessages();

      // ポーリング（3秒ごとに新着確認）
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(loadMessages, 3000);
    }

    // ================================================================
    // メッセージ一覧の読み込み・復号（差分更新）
    // ================================================================

    // 描画済みメッセージIDを記録（チャット相手切り替え時にリセット）
    const renderedIds = new Set();

    async function loadMessages() {
      if (!partnerId) return;
      const res      = await fetch(`/api/messages/${partnerId}`);
      const messages = await res.json();
      const container = document.getElementById('messages');
      if (!container) return;

      const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

      // 新着のみ追記（全消去しないのでチカチカしない）
      for (const m of messages) {
        if (renderedIds.has(m.id)) continue;
        renderedIds.add(m.id);

        const div = document.createElement('div');
        div.className = `message ${m.is_mine ? 'mine' : 'other'}`;
        div.dataset.id = m.id;

        const bubble = document.createElement('div');
        bubble.className = 'bubble decrypting';
        bubble.textContent = '🔓 復号中...';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<span class="lock-icon">🔒</span> ${formatDate(m.created_at)}`;

        div.appendChild(bubble);
        div.appendChild(meta);
        container.appendChild(div);

        decryptMessage(m, bubble);
      }

      if (wasAtBottom) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function decryptMessage(m, bubble) {
      try {
        // 自分が送信者なら encrypted_key_for_sender（自分の公開鍵で暗号化）を使う
        // 受信者なら encrypted_key（自分の公開鍵で暗号化）を使う
        // どちらも「自分の秘密鍵」で復号できる
        const keyToUse = m.is_mine ? m.encrypted_key_for_sender : m.encrypted_key;
        if (!keyToUse) throw new Error('復号キーなし');

        const plaintext = await hybridDecrypt(m.content, keyToUse);
        bubble.className = 'bubble';
        bubble.textContent = plaintext;
      } catch (e) {
        bubble.className = 'bubble';
        bubble.style.color = 'var(--muted)';
        bubble.textContent = '（このデバイスでは復号できません）';
      }
    }

    // ================================================================
    // メッセージ送信
    // ================================================================
    async function sendMessage() {
      const input   = document.getElementById('msgInput');
      const sendBtn = document.getElementById('sendBtn');
      const text    = input.value.trim();
      if (!text || !partnerId) return;

      sendBtn.disabled = true;

      try {
        // 受信者と自分の公開鍵を並行取得
        const [receiverKeyRes, myKeyRes] = await Promise.all([
          fetch(`/api/users/${partnerId}/public-key`),
          fetch(`/api/users/${myId}/public-key`),
        ]);
        const receiverKeyData = await receiverKeyRes.json();
        const myKeyData       = await myKeyRes.json();

        // AES鍵を1つ生成し、受信者用と送信者用の両方の公開鍵で暗号化する
        // （hybridEncryptを2回呼ぶと別々のAES鍵が生成されてしまうため1回で行う）
        const { content, encrypted_key, encrypted_key_for_sender } =
          await hybridEncrypt(text, receiverKeyData.public_key, myKeyData.public_key);

        // 暗号化済みデータをサーバーに送信
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            receiver_id: partnerId,
            content,
            encrypted_key,
            encrypted_key_for_sender,
          }),
        });

        if (res.ok) {
          input.value = '';
          input.style.height = 'auto';
          loadMessages();
        }
      } catch (e) {
        alert('送信に失敗しました: ' + e.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    // ================================================================
    // ユーティリティ
    // ================================================================
    async function logout() {
      if (pollInterval) clearInterval(pollInterval);
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    function openSettings() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    async function changeUsername() {
      const newUsername = document.getElementById('newUsername').value.trim();
      const msg = document.getElementById('usernameMsg');
      msg.className = 'modal-msg';

      if (!newUsername) {
        msg.className = 'modal-msg error';
        msg.textContent = 'ユーザー名を入力してください';
        return;
      }

      const res = await fetch('/api/account/username', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: newUsername }),
      });
      const data = await res.json();

      if (res.ok) {
        msg.className = 'modal-msg success';
        msg.textContent = data.message;
        document.getElementById('myName').textContent = newUsername;
        document.getElementById('newUsername').value = '';
      } else {
        msg.className = 'modal-msg error';
        msg.textContent = data.error;
      }
    }

    async function changePassword() {
      const oldPassword = document.getElementById('oldPassword').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();
      const msg = document.getElementById('passwordMsg');
      msg.className = 'modal-msg';

      if (!oldPassword || !newPassword) {
        msg.className = 'modal-msg error';
        msg.textContent = '全ての項目を入力してください';
        return;
      }

      const res = await fetch('/api/account/password', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_password: oldPassword, new_password: newPassword }),
      });
      const data = await res.json();

      if (res.ok) {
        msg.className = 'modal-msg success';
        msg.textContent = data.message;
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
      } else {
        msg.className = 'modal-msg error';
        msg.textContent = data.error;
      }
    }

    async function deleteAccount() {
      const res = await fetch('/api/account', { method: 'DELETE' });
      if (res.ok) {
        // 秘密鍵もlocalStorageから削除
        localStorage.removeItem('privateKey');
        window.location.href = '/login';
      } else {
        alert('削除に失敗しました');
      }
    }

    function formatDate(str) {
      const d = new Date(str);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    init();
  </script>
</body>
</html>
